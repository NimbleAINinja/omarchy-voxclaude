name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: jq empty manifest.json
      - name: Shell syntax
        run: bash -n bin/voxclaude
      - name: Unit tests
        run: node --test tests/model.test.js
      # The QML tests need qmltestrunner and the manifest check needs the
      # Omarchy CLI, so both stay local; this is everything that runs headless.
      - name: Behaviour tests
        run: bash tests/voxclaude.test.sh
